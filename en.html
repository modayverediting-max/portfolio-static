<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The same loading backdrop as home.html (the hero's blue at the top),
       so the very first frame already looks like the site, never a white page -->
  <style>
    html { background: linear-gradient(0deg, #fff 0%, #3D7EE0 100%) top / 100% 490px no-repeat #fff; }
    @media (min-width: 768px) { html { background-size: 100% 435px; } }
    @media (min-width: 1024px) { html { background-size: 100% 520px; } }
    body { margin: 0; }
  </style>
  <script>
    // modayver.com/en — the home page in English.
    // Chat apps (Instagram, WhatsApp…) build link previews from this file
    // without running scripts, so they find no title and no image and show
    // the plain link. Visitors get the real page (home.html) switched to
    // English, fetched and written in place; the address stays /en.
    fetch('home.html', { cache: 'no-cache' })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        html = html.replace('<html lang="ar" dir="rtl">', '<html lang="en" dir="ltr" data-force-lang="en">');
        // Keep the page hidden until its design (CSS) has loaded, so the raw
        // unstyled page never shows; meanwhile the backdrop shows through
        html = html.replace('<head>', '<head><style id="shell-cover">body > * { visibility: hidden; } body { background: transparent !important; }</style>');
        document.open();
        document.write(html);
        document.close();

        // Browsers skip the tab icon of a page written in place: add it again
        var icon = document.querySelector('link[rel~=icon]');
        if (icon) {
          var freshIcon = icon.cloneNode();
          icon.remove();
          document.head.appendChild(freshIcon);
        }

        var cover = document.getElementById('shell-cover');
        var shown = false;
        function reveal() {
          if (shown) return;
          shown = true;
          if (cover) cover.remove();
          if (location.hash) {
            var target = document.getElementById(location.hash.slice(1));
            if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
          }
        }
        var sheets = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
        Promise.all(sheets.map(function(link) {
          return new Promise(function(done) {
            if (link.sheet) { done(); return; }
            link.addEventListener('load', done);
            link.addEventListener('error', done);
          });
        })).then(reveal);
        setTimeout(reveal, 2500);
      })
      .catch(function() { location.replace('home.html?lang=en'); });
  </script>
</head>
<body></body>
</html>
