<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>html, body { margin: 0; background: #3D7EE0; }</style>
  <script>
    // modayver.com/en — the English home page.
    // Chat apps (Instagram, WhatsApp…) build link previews from this file
    // without running scripts, so they find no title and no image and show
    // the plain link. Visitors get the full home page, in English: it is
    // fetched from index.html and written in place (the address stays /en).
    fetch('index.html', { cache: 'no-cache' })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        html = html.replace('<html lang="ar" dir="rtl">', '<html lang="en" dir="ltr" data-force-lang="en">');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function() { location.replace('index.html?lang=en'); });
  </script>
</head>
<body></body>
</html>
