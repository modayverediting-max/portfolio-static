<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3D7EE0">
  <script src="theme.js?v=2"></script>
  <script>
    // Switch direction before the page paints, so English never flashes in Arabic layout
    (function() {
      try {
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('modayver-lang');
        if (l === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.documentElement.classList.add('i18n-pending');
          setTimeout(function() { document.documentElement.classList.remove('i18n-pending'); }, 2000);
        }
      } catch (e) {}
    })();
  </script>
  <title data-i18n="cm.meta_title">MODAYVER</title>
  <meta name="description" content="صانع عقد المونتاج: اتفاق ودي واضح بين الفريلانسر والعميل، جاهز في دقيقتين" data-i18n-attr="content:cm.meta_desc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="contract.css?v=24">
  <link rel="stylesheet" href="dark.css?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
</head>
<body class="contract-page">

  <!-- Header: only the dark / light and AR / EN switches. The contract maker is a free tool
       for freelancers and clients, so this page shows no logo, no menu and no «تواصل بنا»
       (his rule, 2026-11-05: visitors must never feel it is there to advertise him) -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="header-actions">
          <button type="button" class="theme-switch" onclick="toggleTheme()" aria-label="الوضع الداكن والفاتح" data-i18n-attr="aria-label:common.theme">
            <svg class="ts-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
            <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          </button>
          <button type="button" class="lang-switch" onclick="toggleLang()" aria-label="تغيير اللغة / Switch language">
            <span class="lang-opt active" data-lang-opt="ar">AR</span>
            <span class="lang-opt" data-lang-opt="en">EN</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Intro -->
  <section class="cm-hero">
    <div class="cm-hero-inner">
      <h1 class="cm-title" data-i18n="cm.title">صانع العقد</h1>
      <p class="cm-sub" data-i18n="cm.sub">اتفاق ودي واضح بين الفريلانسر والعميل: أجب عن أسئلة قصيرة، ثم نزّل العقد أو أرسله مباشرة.</p>
      <ul class="cm-badges">
        <li data-i18n="cm.b1">مجاني</li>
        <li data-i18n="cm.b2">دون تسجيل</li>
        <li data-i18n="cm.b3">لا نقرأ عقدك</li>
      </ul>
    </div>
  </section>

  <!-- The maker (built by contract.js) -->
  <section class="cm-app-wrap">
    <div class="cm-app" id="cmApp" aria-live="polite"></div>
  </section>

  <script src="translations.js?v=29"></script>
  <script src="i18n.js?v=26"></script>
  <script src="contract.js?v=37"></script>
</body>
</html>
