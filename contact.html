<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Same gradient the contact page opens with, so opening it never flashes -->
  <style>
    html { background: #fff; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(0deg, rgba(255,255,255,0.5) 0%, #3D7EE0 100%); }
  </style>
  <script>
    // modayver.com/contact.html — the contact page.
    // Chat apps (Instagram, WhatsApp…) build link previews from this file
    // without running scripts, so they find no title and no image and show
    // the plain link. Visitors get the real page (contact-page.html),
    // fetched and written in place; the address stays the same.
    fetch('contact-page.html', { cache: 'no-cache' })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function() { location.replace('contact-page.html' + location.search); });
  </script>
</head>
<body></body>
</html>
