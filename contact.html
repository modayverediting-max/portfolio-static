  <!-- Same gradient the contact page opens with, so opening it never flashes -->
  <style>
    html { background: #fff; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(0deg, rgba(255,255,255,0.5) 0%, #3D7EE0 100%); }
  </style>
  <script>
    // modayver.com/contact.html — the contact page.
    // Chat apps (Instagram, WhatsApp…) build link previews from this file
    // without running scripts, so they find no title and no image and show
    // the plain link. Visitors get the real page (contact-page.html),
    // fetched and written in place; the address stays the same.
    fetch('contact-page.html', { cache: 'no-cache' })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        // Keep the page hidden until its design (CSS) has loaded,
        // so the raw unstyled page never shows
        html = html.replace('<head>', '<head><style id="shell-cover">body > * { visibility: hidden; }</style>');
        document.open();
        document.write(html);
        document.close();

        // Browsers skip the tab icon of a page written in place: add it again
        var icon = document.querySelector('link[rel~=icon]');
        if (icon) {
          var freshIcon = icon.cloneNode();
          icon.remove();
          document.head.appendChild(freshIcon);
        }

        var cover = document.getElementById('shell-cover');
        var shown = false;
        function reveal() {
          if (shown) return;
          shown = true;
          if (cover) cover.remove();
        }
        var sheets = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
        Promise.all(sheets.map(function(link) {
          return new Promise(function(done) {
            if (link.sheet) { done(); return; }
            link.addEventListener('load', done);
            link.addEventListener('error', done);
          });
        })).then(reveal);
        setTimeout(reveal, 2500);
      })
      .catch(function() { location.replace('contact-page.html' + location.search); });
  </script>
